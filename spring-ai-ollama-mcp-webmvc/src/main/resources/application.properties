spring.application.name=spring-ai-ollama-mcp-webmvc

server.port=8088

## 터미널 컬러 출력 설정
spring.output.ansi.enabled=ALWAYS

## SSE 방식의 MCP Server 설정
spring.ai.mcp.server.name=spring-ai-ollama-mcp-webmvc
spring.ai.mcp.server.version=0.0.1

spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

## Logger
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.spring.ai.ollama.mcp=DEBUG
# MCP Server가 반환하는 JSON 로깅
logging.level.io.modelcontextprotocol=DEBUG
# LLM이 어떤 도구를 호출 요청했는지 로깅
logging.level.org.springframework.ai=DEBUG
