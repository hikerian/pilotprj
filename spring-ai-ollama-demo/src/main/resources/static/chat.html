<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring AI with Ollama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>  
  <!-- 마크다운을 HTML로 변환하는 라이브러리-->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>  
  <script>
    // ##### 제출 버튼을 클릭했을 때 실행하는 함수 #####
    async function handleSubmit() {
      try {
        // 텍스트 질문을 얻고 대화 패널에 추가하기
        const question = document.getElementById("question").value;
        if (question === "") return;

		// AJAX 요청하고 응답받기
		const response = await fetch('/ollama/chat', {
		  method: "post",
			headers: {
			  'Content-Type': 'application/x-www-form-urlencoded',
			  'Accept': 'text/plain'
			},					
		  body: new URLSearchParams({ question })
		});
		
		let content = await response.text();
		
        // 텍스트 답변 출력하기
		document.getElementById("answer").value += content + "\n";
      } catch (error) {
        console.log(error)
      } finally {
        //스피너 숨기기
      }
    } 
  </script>
</head>

<body>
  <div class="d-flex flex-column vh-100">
    <div id="inputPanel" class="bg-secondary-subtle">
      <div class="input-group p-2">
        <span class="input-group-text">질문</span>
        <textarea id="question" class="form-control" style="height:200px;">Spring AI에 대해 100자 이내로 설명해줘</textarea>
        <span class="input-group-text">
          <button type="button" class="btn btn-primary" onclick="handleSubmit()">제출</button>
        </span>
      </div>
    </div>

	<div id="inputPanel" class="bg-secondary-subtle">
	  <div class="input-group p-2">
	    <span class="input-group-text">답변</span>
	    <textarea id="answer" class="form-control" style="height:200px;" readonly></textarea>
	  </div>
    </div>
  </div>
</body>

</html>
